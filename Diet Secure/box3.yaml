key_collector:
  - source_id: lvgl_keypad
    min_length: 4
    max_length: 12
    end_keys: "#"
    end_key_required: true
    back_keys: "*"
    allowed_keys: "0123456789*#"
    timeout: 10s
    on_progress:
      - if:
          condition:
            lambda: return (0 != x.compare(std::string{""}));
          then:
            - lambda: |-
                ESP_LOGD("LVGL Keypad", "Current PIN: %s", x.c_str());
    on_timeout:
      - lambda: id(alarm_action) = "";
      - lvgl.page.show: idle_page
    on_result:
      - lambda: |-
          ESP_LOGD("LVGL Keypad", "Submitted PIN: %s", x.c_str());
      - if:
          condition:
            lambda: return (id(alarm_action) == "view_lock_page");
          then:
            - if:
                condition:
                  lambda: return (0 == x.compare(std::string("${master_pin}")));
                then:
                  - lambda: id(alarm_action) = "";
                  - lvgl.page.show: main_lock_page
                else:
                  - lvgl.label.update:
                      id: lbl_keypad_error
                      text: "Incorrect PIN"
                  - lvgl.widget.show: lbl_keypad_error
                  - lambda: id(alarm_action) = "";
                  - lvgl.page.show: idle_page
          else:
            - if:
                condition:
                  lambda: return (id(alarm_action) == "settings_unlock");
                then:
                  - if:
                      condition:
                        lambda: return (0 == x.compare(std::string("${settings_pin}")));
                      then:
                        - lambda: id(alarm_action) = "";
                        - lvgl.page.show: settings_hub_page
                      else:
                        - lvgl.label.update:
                            id: lbl_keypad_error
                            text: "Incorrect PIN"
                        - lvgl.widget.show: lbl_keypad_error
                        - lambda: id(alarm_action) = "";
                        - lvgl.page.show: idle_page
                else:
                  - lambda: id(alarm_action) = "";
                  - lvgl.page.show: idle_page

###### LVGL Display UI ######
# All UI configuration is below. 
# The sequences of pages impacts the next/previous buttons.
# The UI sends actions to entities while entities send status or can change icons/colors/properties.
# This means most widgets that perform an action on an entity the corresponding entity updates the widget.
#############################
lvgl:
  id: lvgl_display
  bottom_layer:
    bg_color: 0x000000
  buffer_size: 100%
  byte_order: ${lvgl_byte_order}
  on_idle:
    - timeout: 1s
      then:
        - script.execute: saver_enabled
  pages:
    - id: main_lock_page
      skip: true
      on_swipe_left:
        - lvgl.page.show: idle_page
      on_swipe_right:
        - lvgl.page.show: idle_page
      widgets:
        - obj:
            styles: page_content
            widgets:
              - button:
                  id: but_front_door_lock
                  width: 100%
                  height: 100%
                  align: CENTER
                  bg_color: 0x330000
                  bg_grad_color: 0x1a0000
                  bg_grad_dir: VER
                  bg_opa: COVER
                  border_width: 0
                  radius: 0
                  shadow_width: 0
                  widgets:
                    - label:
                        id: ico_front_door_lock
                        align: CENTER
                        y: -34
                        text_font: icon_font_80
                        text_color: red
                        text: "\U000F033F"
                    - label:
                        id: lbl_front_door_status
                        align: CENTER
                        y: 40
                        text_font: labelfont_large
                        text_align: CENTER
                        text_color: red
                        text: "UNLOCKED"
                    - label:
                        id: lbl_front_door_action
                        align: CENTER
                        y: 68
                        text_font: my_font16
                        text_align: CENTER
                        text_color: 0xCCCCCC
                        text: "Tap to Lock"
                    - label:
                        align: TOP_MID
                        y: 6
                        text_font: my_font16
                        text_align: CENTER
                        text_color: 0xCCCCCC
                        text: '${front_door_name}'
                    - label:
                        id: lbl_door_alarm_status
                        align: TOP_MID
                        y: 32
                        text_font: my_font12
                        text_align: CENTER
                        text_color: 0xCCCCCC
                        text: '${door_alarm_door_name}: --'
                  on_release:
                    then:
                      # PIN gating (if enabled) already happened before this page
                      # was shown, so a tap here just performs the action, then
                      # returns to the home page.
                      - if:
                          condition:
                            lambda: return (id(front_door_item).state == "locked");
                          then:
                            - homeassistant.action:
                                action: lock.unlock
                                data:
                                  entity_id: ${front_door_entity}
                      - if:
                          condition:
                            lambda: return (id(front_door_item).state == "unlocked" || id(front_door_item).state == "open");
                          then:
                            - homeassistant.action:
                                action: lock.lock
                                data:
                                  entity_id: ${front_door_entity}
                      - lvgl.page.show: idle_page

    - id: idle_page
      widgets:
        - obj:
            styles: page_content
            widgets:
              - obj:
                  align: TOP_MID
                  styles: header_footer
                  widgets:
                    # ── Left: chevron + LIGHTS — tappable, goes to LIV light control ──
                    - button:
                        id: but_home_lights
                        align: LEFT_MID
                        x: 4
                        width: 46%
                        height: 100%
                        bg_opa: TRANSP
                        border_width: 0
                        shadow_width: 0
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: START
                          flex_align_cross: CENTER
                          pad_column: 2
                        widgets:
                          - label:
                              id: ico_home_lights
                              text_font: iconfont_small
                              text_color: 0xFFCC00
                              text: "\U000F0B28"
                          - label:
                              id: lbl_home_lights
                              text_font: my_font12
                              text_color: 0xFFFFFF
                              text: "LIGHTS"
                        on_release:
                          - lvgl.page.show: liv_lite_page
                    # ── Right: SETTINGS + chevron — tappable, asks settings_pin ──
                    - button:
                        id: but_home_settings
                        align: RIGHT_MID
                        x: -4
                        width: 46%
                        height: 100%
                        bg_opa: TRANSP
                        border_width: 0
                        shadow_width: 0
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: END
                          flex_align_cross: CENTER
                          pad_column: 2
                        widgets:
                          - label:
                              id: lbl_home_settings
                              text_font: my_font12
                              text_color: 0xFFFFFF
                              text: "SETTINGS"
                          - label:
                              id: ico_home_settings
                              text_font: iconfont_small
                              text_color: 0xAAAAAA
                              text: "\U000F0B2A"
                        on_release:
                          - lvgl.widget.hide: lbl_keypad_error
                          - lambda: id(alarm_action) = "settings_unlock";
                          - lvgl.page.show: alarm_keypad_page
              # ── Home body: clock, date, door status — stacked, no overlap ──
              - obj:
                  id: home_body
                  align: TOP_MID
                  y: 50
                  width: 100%
                  height: 170
                  pad_all: 0
                  bg_opa: TRANSP
                  border_opa: TRANSP
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_row: 4
                  widgets:
                    - label:
                        id: home_clock_label
                        text_align: CENTER
                        text_color: 0xFFFFFF
                        text_font: montserrat_48
                    - label:
                        id: home_date_label
                        text_align: CENTER
                        text_color: 0xCCCCCC
                        text_font: my_font22
                    - obj:
                        id: home_door_status_row
                        width: 100%
                        height: 30
                        pad_all: 0
                        bg_opa: TRANSP
                        border_opa: TRANSP
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: CENTER
                          flex_align_cross: CENTER
                          pad_column: 4
                        widgets:
                          - label:
                              id: ico_home_door_status
                              text_font: iconfont_small
                              text_color: 0xCCCCCC
                              text: "\U000F033F"
                          - label:
                              id: lbl_home_door_status
                              text_align: CENTER
                              text_font: labelfont_large
                              text_color: 0xCCCCCC
                              text: '${front_door_name}: --'
                    - label:
                        id: lbl_home_door_alarm_status
                        text_align: CENTER
                        text_font: my_font16
                        text_color: 0xCCCCCC
                        text: '${door_alarm_door_name}: --'
              # ── No HA Connection status (replaces old full-screen no-connection page) ──
              - label:
                  id: lbl_no_ha_connection
                  hidden: true
                  align: BOTTOM_MID
                  y: -14
