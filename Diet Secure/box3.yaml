          then:
            - lvgl.pause:
                show_snow: false

sensor:
  - platform: adc
    pin: GPIO10
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: "voltage"
    entity_category: "diagnostic"
    disabled_by_default: true
    update_interval: 30s
    attenuation: auto
    filters:
      - multiply: 4.11

  - platform: copy
    id: battery_percent
    source_id: battery_voltage
    name: "Battery level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: "battery"
    entity_category: "diagnostic"
    filters:
      - lambda: return (x - 2.7) / (4.2 - 2.7) * 100;
      - clamp:
          min_value: 0
          max_value: 100
    on_value:
      - lvgl.label.update:
          id: lbl_battery
          text: !lambda |-
            char buf[10];
            sprintf(buf, "%.f%%", id(battery_percent).state);
            return buf;
      - lvgl.label.update:
          id: lbl_home_battery
          text: !lambda |-
            char buf[10];
            sprintf(buf, "%.f%%", id(battery_percent).state);
            return buf;
      - lvgl.label.update:
          id: ico_home_battery
          text: !lambda |-
            int lvl = (int) x;
            if (lvl <= 5)   return "\U000F008E"; // outline / empty
            if (lvl <= 15)  return "\U000F007A"; // 10%
            if (lvl <= 25)  return "\U000F007B"; // 20%
            if (lvl <= 35)  return "\U000F007C"; // 30%
            if (lvl <= 45)  return "\U000F007D"; // 40%
            if (lvl <= 55)  return "\U000F007E"; // 50%
            if (lvl <= 65)  return "\U000F007F"; // 60%
            if (lvl <= 75)  return "\U000F0080"; // 70%
            if (lvl <= 85)  return "\U000F0081"; // 80%
            if (lvl <= 95)  return "\U000F0082"; // 90%
            return "\U000F0079"; // 100%
      - lvgl.label.update:
          id: ico_home_battery
          text_color: !lambda |-
            int lvl = (int) x;
            if (lvl <= 15) return lv_color_hex(0xFF4444); // red - low
            if (lvl <= 35) return lv_color_hex(0xFFAA00); // amber - warning
            return lv_color_hex(0xFFFFFF); // normal
      - if:
          condition:
              lambda: return (x > 0);
          then:
            - lvgl.widget.show: lbl_battery_title
            - lvgl.widget.show: lbl_battery
            - lvgl.widget.show: ico_home_battery
            - lvgl.widget.show: lbl_home_battery
          else:
            - lvgl.widget.hide: lbl_battery_title
            - lvgl.widget.hide: lbl_battery
            - lvgl.widget.hide: ico_home_battery
            - lvgl.widget.hide: lbl_home_battery
    
  - platform: wifi_signal #requires WIFI
    name: "WiFi db"
    id: wifi_signal_db
    update_interval: 30s

  - platform: copy #requires WIFI
    source_id: wifi_signal_db
    name: "WiFi Signal"
    id: wifi_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    on_value:
      - lvgl.label.update:
          id: lbl_ss
          text: !lambda |-
            char buf[10];
            sprintf(buf, "%.f%%", id(wifi_percent).state);
            return buf;

##############################################################################
## LIGHT WIDGET SENSORS
##############################################################################

### LIGHT WIDGET - Brightness ###
  - platform: homeassistant
    id: light_widget_brightness
    entity_id: ${light_widget_entity}
    attribute: brightness
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return !std::isnan(x) &&
                  !(lv_indev_get_act() != nullptr &&
                    lv_indev_get_active_obj() == id(slider_light_brightness));
            then:
              - lvgl.slider.update:
                  id: slider_light_brightness
                  value: !lambda return (int)(x / 255.0 * 100.0);

### LIGHT WIDGET - Color Temp ###
  - platform: homeassistant
    id: light_widget_color_temp
    entity_id: ${light_widget_entity}
    attribute: color_temp
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return !std::isnan(x) &&
                  !(lv_indev_get_act() != nullptr &&
                    lv_indev_get_active_obj() == id(slider_color_temp));
            then:
              - lvgl.slider.update:
                  id: slider_color_temp
                  value: !lambda return (int)x;

### HOME SCREEN WEATHER TEMPERATURE (reads the "temperature" attribute of weather_entity) ###
  - platform: homeassistant
    id: weather_temp_item
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true
    on_value:
      then:
        - if:
            # A NAN reading means the attribute was unavailable/missing
            # (e.g. HA rebooting) — ignore it and keep showing the last
            # good temperature instead of blanking the label/background.
            condition:
              lambda: return !std::isnan(x);
            then:
              - lvgl.label.update:
                  id: lbl_home_weather_temp
                  text: !lambda |-
                    char buf[16];
                    sprintf(buf, "%.0f%s", x, "${weather_temp_unit}");
                    return std::string(buf);
              - lvgl.widget.show: lbl_home_weather_temp


speaker:
  - id: i2s_audio_speaker
    platform: i2s_audio
    i2s_audio_id: audio_bus
    i2s_dout_pin: ${speaker_i2s_dout_pin}
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono
    audio_dac: es8311_dac
    buffer_duration: 100ms

  - id: mixing_speaker
    platform: mixer
    output_speaker: i2s_audio_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

media_player:
  - platform: speaker
    name: Media Player
    id: speaker_media_player
    task_stack_in_psram: true
    volume_increment: 0.05
    volume_min: 0.5
    volume_max: 0.8
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 2
      sample_rate: 48000
    on_state:
      then:
        - lambda: ESP_LOGD("media_player", "on_state");
        - if:
            condition:
              not:
                media_player.is_announcing:
            then:
              - mixer_speaker.apply_ducking:
                  id: media_mixing_input
                  decibel_reduction: 0
                  duration: 1.0s
        - if:
            condition:
              media_player.is_idle:
            then:
              - switch.turn_off: speaker_enable
            else:
              - switch.turn_on: speaker_enable
    on_announcement:
      - lambda: ESP_LOGD("media_player", "on_announcement");
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_pause:
      - media_player.stop
    on_volume:
      - lambda: |-
          ESP_LOGD("volume", "Volume: %f", x);
      - lambda: id(speaker_volume) = int(x * 10) ;

script:
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  and:
                    - or:
                        - lambda: return id(ethernet_connection);
                        - lambda: return id(wifi_connection);
                    - lambda: return id(api_connection);
                then:
                  - lvgl.widget.hide: lbl_no_ha_connection
                else:
                  - lvgl.widget.show: lbl_no_ha_connection

  - id: time_update
    then:
      - lvgl.label.update:
          id: home_date_label
          text: !lambda |-
            static const char* days[] {"${sun}","${mon}","${tue}","${wed}","${thur}","${fri}","${sat}"};
            static const char* months[] {"${january}","${february}","${march}","${april}","${may}","${june}","${july}","${august}","${september}","${october}","${november}","${december}"};
            // Prefer HA's clock (it carries HA's configured timezone);
            // fall back to SNTP if HA hasn't synced yet (e.g. HA is
            // still rebooting) so the date isn't blank on a fresh boot.
            auto t = id(ha_time).now();
            if (!t.is_valid()) t = id(sntp_time).now();
            if (!t.is_valid()) return std::string("");
            char buffer[50];
            sprintf(buffer, "%s %s %d",days[t.day_of_week - 1],months[t.month - 1],t.day_of_month);
            return std::string(buffer);
      - if:
          condition:
            - lambda: 'return { id(time_format).current_option() == "24 Hr" };'
          then:
            - lvgl.label.update:
                id: home_clock_label
                text: 
                  time_format: "%H:%M"
                  time: !lambda |-
                    auto t = id(ha_time).now();
                    if (!t.is_valid()) t = id(sntp_time).now();
                    return t;
          else:
            - lvgl.label.update:
                id: home_clock_label
                text: 
                  time_format: "%l:%M %p"
                  time: !lambda |-
                    auto t = id(ha_time).now();
                    if (!t.is_valid()) t = id(sntp_time).now();
                    return t;
      - if:
          condition:
            and:
              - switch.is_on: reboot_schedule
              - lambda: 'return { (id(ha_time).now().hour == id(reboot_time).hour) };'
              - lambda: 'return { (id(ha_time).now().minute == id(reboot_time).minute) };'
              - lambda: 'return { (id(ha_time).now().second <= 15) };'
          then:
            - delay: 10s
            - button.press: reboot
    mode: single
    
    
  - id: set_uimode
    then:
      - if:
          condition: 
            - lambda: return (id(uimode).current_option() != id(current_uimode));
          then:
            - if:
                condition: 
                  lambda: return (id(uimode).current_option() == "Home");
                then:
                  - lvgl.style.update:
                      id: header_footer
                      bg_color: 0x595959
                      bg_grad_color: 0x404040
                  - lvgl.style.update:
                      id: button_style
                      bg_color: 0x000000
                      bg_grad_color: 0x404040
                  - lvgl.style.update:
                      id: button_standard_style
                      bg_color: 0x216dab
                      bg_grad_color: 0x404040
                  - lvgl.style.update:
                      id: button_pressed_style
                      bg_color: 0x666666
                      bg_grad_color: 0x00334d
                  - lvgl.style.update:
                      id: button_checked_style
                      bg_color: 0x000000
                      bg_grad_color: 0x002233
            - lambda: strncpy(id(current_uimode), id(uimode).current_option().c_str(), 50);
            - lvgl.widget.redraw:

  - id: wifi_do_scan
    then:
      - if:
          condition:
            lambda: return !id(wifi_scanning);
          then:
            - lambda: id(wifi_scanning) = true;
            - lvgl.label.update:
                id: lbl_wifi_status
                text: "Scanning..."
            - lambda: |-
                lv_obj_t *list = id(wifi_scan_list);
                lv_obj_clean(list);
                wifi_scan_config_t scan_config = {};
                scan_config.show_hidden = false;
                scan_config.scan_type = WIFI_SCAN_TYPE_ACTIVE;
                scan_config.scan_time.active.min = 80;
                scan_config.scan_time.active.max = 150;
                esp_err_t err = esp_wifi_scan_start(&scan_config, true);
                App.feed_wdt();
                if (err != ESP_OK) {
                  lv_obj_t *lbl = lv_label_create(list);
                  lv_label_set_text(lbl, "Scan failed - try again");
                  lv_obj_set_style_text_color(lbl, lv_color_hex(0xFF6666), 0);
                } else {
                  uint16_t ap_count = 0;
                  esp_wifi_scan_get_ap_num(&ap_count);
                  if (ap_count == 0) {
                    lv_obj_t *lbl = lv_label_create(list);
                    lv_label_set_text(lbl, "No networks found");
                    lv_obj_set_style_text_color(lbl, lv_color_hex(0xAAAAAA), 0);
                  } else {
                    uint16_t number = ap_count > 15 ? 15 : ap_count;
                    wifi_ap_record_t ap_info[15];
                    esp_wifi_scan_get_ap_records(&number, ap_info);
                    for (int i = 0; i < number; i++) {
                      char buf[56];
                      const char *name = ap_info[i].ssid[0] ? (const char *) ap_info[i].ssid : "(hidden network)";
                      snprintf(buf, sizeof(buf), "%s   %d dBm", name, ap_info[i].rssi);
                      lv_obj_t *lbl = lv_label_create(list);
                      lv_label_set_text(lbl, buf);
                      lv_obj_set_width(lbl, lv_pct(100));
                      lv_obj_set_style_text_color(lbl, lv_color_white(), 0);
                    }
                  }
                }
                App.feed_wdt();
            - lvgl.label.update:
                id: lbl_wifi_status
                text: "Tap refresh to scan again"
            - lambda: id(wifi_scanning) = false;
          else:
            - lvgl.label.update:
                id: lbl_wifi_status
                text: "Already scanning..."

  - id: ble_do_scan
    then:
      - if:
          condition:
            lambda: return !id(ble_scanning);
          then:
            - lambda: |-
                lv_obj_t *list = id(ble_scan_list);
                lv_obj_clean(list);
                id(ble_seen).clear();
                id(ble_scanning) = true;
            - lvgl.label.update:
                id: lbl_ble_status
                text: "Scanning for 6 seconds..."
            - delay: 6s
            - lambda: |-
                id(ble_scanning) = false;
                lv_obj_t *list = id(ble_scan_list);
                if (id(ble_seen).empty()) {
                  lv_obj_t *lbl = lv_label_create(list);
                  lv_label_set_text(lbl, "No devices found");
                  lv_obj_set_style_text_color(lbl, lv_color_hex(0xAAAAAA), 0);
                } else {
                  for (auto const &entry : id(ble_seen)) {
                    std::string label = entry.second;
                    const char *icon = "\U000F00AF"; // generic bluetooth
                    std::string lower = label;
                    for (auto &c : lower) c = tolower(c);
                    if (lower.find("phone") != std::string::npos ||
                        lower.find("iphone") != std::string::npos ||
                        lower.find("galaxy") != std::string::npos) {
                      icon = "\U000F011C"; // cellphone
                    } else if (lower.find("headphone") != std::string::npos ||
                               lower.find("buds") != std::string::npos ||
                               lower.find("airpods") != std::string::npos ||
                               lower.find("earbud") != std::string::npos ||
                               lower.find("beats") != std::string::npos) {
                      icon = "\U000F02CB"; // headphones
                    } else if (lower.find("macbook") != std::string::npos ||
                               lower.find("laptop") != std::string::npos ||
                               lower.find("pc") != std::string::npos) {
                      icon = "\U000F0322"; // laptop
                    }
                    lv_obj_t *row = lv_obj_create(list);
                    lv_obj_set_width(row, lv_pct(100));
                    lv_obj_set_height(row, LV_SIZE_CONTENT);
                    lv_obj_set_style_bg_opa(row, LV_OPA_TRANSP, 0);
                    lv_obj_set_style_border_opa(row, LV_OPA_TRANSP, 0);
                    lv_obj_set_style_pad_all(row, 0, 0);
                    lv_obj_set_flex_flow(row, LV_FLEX_FLOW_ROW);
                    lv_obj_set_style_pad_column(row, 6, 0);
                    lv_obj_t *ico = lv_label_create(row);
                    lv_obj_set_style_text_font(ico, id(iconfont_small), 0);
                    lv_obj_set_style_text_color(ico, lv_color_white(), 0);
                    lv_label_set_text(ico, icon);
                    lv_obj_t *lbl = lv_label_create(row);
                    lv_obj_set_style_text_color(lbl, lv_color_white(), 0);
                    lv_label_set_text(lbl, label.c_str());
                  }
                }
            - lvgl.label.update:
                id: lbl_ble_status
                text: "Tap refresh to scan again"
          else:
            - lvgl.label.update:
                id: lbl_ble_status
                text: "Already scanning..."

switch:
  - platform: gpio
    id: speaker_enable
    internal: true
    pin:
      number: ${speaker_enable_pin}
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF

  - platform: template
    name: Require PIN to unlock front door
    id: front_door_require_pin
    icon: 'mdi:lock-question'
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    turn_on_action:
      - lvgl.checkbox.update:
          id: chk_front_door_pin
          state:
            checked: true
    turn_off_action:
      - lvgl.checkbox.update:
          id: chk_front_door_pin
          state:
            checked: false

  - platform: template
    name: "Reboot Schedule"
    id: reboot_schedule
    icon: 'mdi:restart'
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

select:
  - platform: lvgl
    id: time_format
    internal: true
    restore_value: true
    name: Time Format
    widget: dropdown_timeformat

  - platform: lvgl
    id: uimode
    internal: true
    restore_value: true
    name: UI Mode
    widget: dropdown_uimode

datetime:
  - id: reboot_time
    platform: template
    type: time
    optimistic: true
    restore_value: true
    initial_value:
      hour: 02
      minute: 00
      second: 00
    name: "Reboot Time"
    icon: 'mdi:restart-alert'
    entity_category: config

number:
  - id: s_default_brightness
    platform: template
    name: "Default Brightness"
    icon: 'mdi:monitor'
    entity_category: config
    unit_of_measurement: '%'
    optimistic: true
    restore_value: true
    initial_value: 100
    step: 5
    min_value: 20
    max_value: 100
    on_value:
      - component.update: s_default_brightness
      - lvgl.slider.update:
          id: slider_brightness
          value: !lambda return x;
      - lambda: id(led).turn_on().set_brightness(x / 100).perform();

globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: ethernet_connection
    type: bool
    restore_value: false
    initial_value: "false"
  - id: wifi_connection
    type: bool
    restore_value: false
    initial_value: "false"
  - id: api_connection
    type: bool
    restore_value: false
    initial_value: "false"
  - id: api_fail_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: speaker_volume
    type: int
    restore_value: false
    initial_value: '5'
  - id: wifi_scanning
    type: bool
    restore_value: false
    initial_value: "false"
  - id: disconnect_since_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: had_api_connection
    type: bool
    restore_value: false
    initial_value: "false"
    # True once the API has connected at least once since the ESP itself
    # booted. Used (instead of disconnect_since_ms) to decide whether an
    # on_client_connected event is a genuine reconnect worth popping up
    # "Welcome Home" for, vs. the very first connect after an ESP reboot.
    # Unlike disconnect_since_ms, this doesn't depend on reliably catching
    # the moment of disconnection (on_client_disconnected can fail to fire
    # promptly on a graceful HA restart or a soft/roaming WiFi drop) — it
    # only needs to know a connection happened before, which is certain.
  - id: front_door_known_state
    type: std::string
    restore_value: false
    initial_value: '""'
    # Last CONFIRMED "locked"/"unlocked"/"open"/etc. value from HA for
    # front_door_item. Unlike front_door_item.state itself, this never
    # gets clobbered by a transient "unavailable"/"unknown" report (e.g.
    # right as the ESP reconnects to HA, or while HA is rebooting). Drives
    # the front door lock screen icon/label only.
  - id: weather_known_condition
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: ble_scanning
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ble_seen
    type: std::map<uint64_t, std::string>
    restore_value: false
  - id: alarm_action
    type: std::string
    initial_value: ""
  - id: current_uimode
    type: char[50]
    initial_value: ""

