key_collector:
  - source_id: lvgl_keypad
    min_length: 4
    max_length: 12
    end_keys: "#"
    end_key_required: true
    back_keys: "*"
    allowed_keys: "0123456789*#"
    timeout: 10s
    on_progress:
      - if:
          condition:
            lambda: return (0 != x.compare(std::string{""}));
          then:
            - lambda: |-
                ESP_LOGD("LVGL Keypad", "Current PIN: %s", x.c_str());
    on_timeout:
      - lambda: id(alarm_action) = "";
      - lvgl.page.show: idle_page
    on_result:
      - lambda: |-
          ESP_LOGD("LVGL Keypad", "Submitted PIN: %s", x.c_str());
      - if:
          condition:
            lambda: return (id(alarm_action) == "view_lock_page");
          then:
            - if:
                condition:
                  lambda: return (0 == x.compare(std::string("${master_pin}")));
                then:
                  - lambda: id(alarm_action) = "";
                  - lvgl.page.show: main_lock_page
                else:
                  - lvgl.label.update:
                      id: lbl_keypad_error
                      text: "Incorrect PIN"
                  - lvgl.widget.show: lbl_keypad_error
                  - lambda: id(alarm_action) = "";
                  - lvgl.page.show: idle_page
          else:
            - if:
                condition:
                  lambda: return (id(alarm_action) == "settings_unlock");
                then:
                  - if:
                      condition:
                        lambda: return (0 == x.compare(std::string("${settings_pin}")));
                      then:
                        - lambda: id(alarm_action) = "";
                        - lvgl.page.show: settings_hub_page
                      else:
                        - lvgl.label.update:
                            id: lbl_keypad_error
                            text: "Incorrect PIN"
                        - lvgl.widget.show: lbl_keypad_error
                        - lambda: id(alarm_action) = "";
                        - lvgl.page.show: idle_page
                else:
                  - lambda: id(alarm_action) = "";
                  - lvgl.page.show: idle_page

###### LVGL Display UI ######
# All UI configuration is below. 
# The sequences of pages impacts the next/previous buttons.
# The UI sends actions to entities while entities send status or can change icons/colors/properties.
# This means most widgets that perform an action on an entity the corresponding entity updates the widget.
#############################
lvgl:
  id: lvgl_display
  bottom_layer:
    bg_color: 0x000000
  top_layer:
    widgets:
      # ── Reconnect popup: shown whenever the API reconnects after any
      # disconnect (i.e. the No HA Connection indicator goes back to
      # Connected). Lives in top_layer so it overlays whatever screen is
      # currently showing, except the settings PIN keypad (see api:
      # on_client_connected). ──
      - obj:
          id: reconnect_unlock_popup
          hidden: true
          align: CENTER
          width: 100%
          height: 100%
          radius: 0
          bg_color: 0x000000
          bg_opa: 85%
          border_opa: TRANSP
          pad_all: 0
          widgets:
            - obj:
                align: CENTER
                width: 260
                height: 150
                bg_color: 0x1a1a1a
                bg_opa: COVER
                border_color: 0x444444
                border_width: 1
                radius: 8
                pad_all: 10
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  pad_row: 10
                widgets:
                  - label:
                      text: "Welcome Home"
                      text_align: CENTER
                      text_color: 0xFFFFFF
                      text_font: my_font16
                      long_mode: WRAP
                      width: 100%
                  - label:
                      text: "Unlock Front Door?"
                      text_align: CENTER
                      text_color: amber
                      text_font: my_font16
                      long_mode: WRAP
                      width: 100%
                  - obj:
                      width: 100%
                      height: 40
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      pad_all: 0
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_EVENLY
                        flex_align_cross: CENTER
                      widgets:
                        - button:
                            width: 100
                            height: 36
                            styles: button_style
                            pressed:
                              styles: button_pressed_style
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "No"
                                  text_color: 0xFFFFFF
                            on_release:
                              - lvgl.widget.hide: reconnect_unlock_popup
                        - button:
                            width: 100
                            height: 36
                            bg_color: 0x330000
                            bg_grad_color: 0x1a0000
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "Yes"
                                  text_color: red
                            on_release:
                              - homeassistant.action:
                                  action: lock.unlock
                                  data:
                                    entity_id: ${front_door_entity}
                              - lvgl.widget.hide: reconnect_unlock_popup

  buffer_size: 100%
  byte_order: ${lvgl_byte_order}
  pages:
    - id: main_lock_page
      skip: true
      on_swipe_left:
        - lvgl.page.show: idle_page
      on_swipe_right:
        - lvgl.page.show: idle_page
      widgets:
        - obj:
            styles: page_content
            widgets:
              - button:
                  id: but_front_door_lock
                  width: 100%
                  height: 100%
                  align: CENTER
                  bg_color: 0x330000
                  bg_grad_color: 0x1a0000
                  bg_grad_dir: VER
                  bg_opa: COVER
                  border_width: 0
                  radius: 0
                  shadow_width: 0
                  widgets:
                    - label:
                        id: ico_front_door_lock
                        align: CENTER
                        y: -34
                        text_font: icon_font_80
                        text_color: red
                        text: "\U000F033F"
                    - label:
                        id: lbl_front_door_status
                        align: CENTER
                        y: 40
                        text_font: labelfont_large
                        text_align: CENTER
                        text_color: red
                        text: "UNLOCKED"
                    - label:
                        id: lbl_front_door_action
                        align: CENTER
                        y: 68
                        text_font: my_font16
                        text_align: CENTER
                        text_color: 0xCCCCCC
                        text: "Tap to Lock"
                    - label:
                        align: TOP_MID
                        y: 6
                        text_font: my_font16
                        text_align: CENTER
                        text_color: 0xCCCCCC
                        text: '${front_door_name}'
                    - label:
                        id: lbl_door_alarm_status
                        align: TOP_MID
                        y: 32
                        text_font: my_font12
                        text_align: CENTER
                        text_color: 0xCCCCCC
                        text: '${door_alarm_door_name}: --'
                  on_release:
                    then:
                      # PIN gating (if enabled) already happened before this page
                      # was shown, so a tap here just performs the action, then
                      # returns to the home page.
                      - if:
                          condition:
                            lambda: return (id(front_door_item).state == "locked");
                          then:
                            - homeassistant.action:
                                action: lock.unlock
                                data:
                                  entity_id: ${front_door_entity}
                      - if:
                          condition:
                            lambda: return (id(front_door_item).state == "unlocked" || id(front_door_item).state == "open");
                          then:
                            - homeassistant.action:
                                action: lock.lock
                                data:
                                  entity_id: ${front_door_entity}
                      - lvgl.page.show: idle_page

    - id: idle_page
      widgets:
        - obj:
            styles: page_content
            widgets:
              # ── Weather background wash — sits behind everything else on
              # this page; updated by weather_condition_item's on_value
              # handler. Starts black/transparent-looking (matches
              # page_content's own bg) until the first weather report
              # arrives, so there's no odd flash on a fresh boot. ──
              - obj:
                  id: weather_bg
                  align: TOP_MID
                  width: 100%
                  height: 100%
                  radius: 0
                  bg_opa: COVER
                  bg_grad_dir: VER
                  bg_color: 0x000000
                  bg_grad_color: 0x000000
                  border_opa: TRANSP
                  pad_all: 0
              - obj:
                  align: TOP_MID
                  styles: header_footer
                  widgets:
                    # ── Left: chevron + LIGHTS — tappable, goes to LIV light control ──
                    - button:
                        id: but_home_lights
                        align: LEFT_MID
                        x: 4
                        width: 46%
                        height: 100%
                        bg_opa: TRANSP
                        border_width: 0
                        shadow_width: 0
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: START
                          flex_align_cross: CENTER
                          pad_column: 2
                        widgets:
                          - label:
                              id: ico_home_lights
                              text_font: iconfont_small
                              text_color: 0xFFCC00
                              text: "\U000F0B28"
                          - label:
                              id: lbl_home_lights
                              text_font: my_font12
                              text_color: 0xFFFFFF
                              text: "LIGHTS"
                        on_release:
                          - lvgl.page.show: liv_lite_page
                    # ── Right: SETTINGS + chevron — tappable, asks settings_pin ──
                    - button:
                        id: but_home_settings
                        align: RIGHT_MID
                        x: -4
                        width: 46%
                        height: 100%
                        bg_opa: TRANSP
                        border_width: 0
                        shadow_width: 0
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: END
                          flex_align_cross: CENTER
                          pad_column: 2
                        widgets:
                          - label:
                              id: lbl_home_settings
                              text_font: my_font12
                              text_color: 0xFFFFFF
                              text: "SETTINGS"
                          - label:
                              id: ico_home_settings
                              text_font: iconfont_small
                              text_color: 0xAAAAAA
                              text: "\U000F0B2A"
                        on_release:
                          - lvgl.widget.hide: lbl_keypad_error
                          - lambda: id(alarm_action) = "settings_unlock";
                          - lvgl.page.show: alarm_keypad_page
                    # ── Center: hamburger menu — opens the Menu Pages hub ──
                    - button:
                        id: but_home_menu
                        align: CENTER
                        width: 30
                        height: 100%
                        bg_opa: TRANSP
                        border_width: 0
                        shadow_width: 0
                        widgets:
                          - label:
                              id: ico_home_menu
                              align: CENTER
                              text_font: iconfont_small
                              text_color: 0xFFFFFF
                              text: "\U000F035C"
                        on_release:
                          - lvgl.page.show: menu_pages_page
              # ── Home body: clock, date, door status — stacked, no overlap ──
              - obj:
                  id: home_body
                  align: TOP_MID
                  y: 50
                  width: 100%
                  height: 170
                  pad_all: 0
                  bg_opa: TRANSP
                  border_opa: TRANSP
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_row: 4
                  widgets:
                    - label:
                        id: home_clock_label
                        text_align: CENTER
                        text_color: 0xFFFFFF
                        text_font: montserrat_48
                    - label:
                        id: home_date_label
                        text_align: CENTER
                        text_color: 0xCCCCCC
                        text_font: my_font22
                    - obj:
                        id: home_status_row
                        width: 100%
                        height: 30
                        pad_all: 0
                        bg_opa: TRANSP
                        border_opa: TRANSP
                        scrollbar_mode: 'OFF'
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: CENTER
                          flex_align_cross: CENTER
                          pad_column: 8
                        widgets:
                          - label:
                              id: ico_home_door_status
                              text_font: icon_font_30
                              text_color: 0xCCCCCC
                              text: "\U000F033F"
                          - label:
                              id: ico_home_door_alarm
                              text_font: icon_font_30
                              text_color: 0xCCCCCC
                              text: "\U000F081B"
                          - label:
                              id: ico_home_weather
                              hidden: true
                              text_font: icon_font_30
                              text_color: 0xFFFFFF
