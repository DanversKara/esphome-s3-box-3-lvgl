text_sensor:
### LIGHT WIDGET STATE SENSOR ###
  - platform: homeassistant
    id: light_widget_state
    entity_id: ${light_widget_entity}
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: return (x == "on");
            then:
              - lvgl.widget.update:
                  id: btn_light_widget_toggle
                  state:
                    checked: true
              - lvgl.label.update:
                  id: ico_light_widget
                  text: "\U000F06E8"
                  text_color: yellow
            else:
              - lvgl.widget.update:
                  id: btn_light_widget_toggle
                  state:
                    checked: false
              - lvgl.label.update:
                  id: ico_light_widget
                  text: "\U000F0335"
                  text_color: 0x888888
  - platform: wifi_info #requires WIFI
    ip_address:
      name: IP Address
      id: ip_addr
      entity_category: "diagnostic"
    ssid:
      id: connected_ssid
      name: SSID
      entity_category: "diagnostic"
    bssid:
      id: connected_bssid
      name: BSSID
      entity_category: "diagnostic"
    mac_address:
      id: device_mac

  - platform: template
    id: up_sens_text
    name: Device uptime
    entity_category: "diagnostic"
    icon: mdi:clock
    on_value:
      - lvgl.label.update:
          id: lbl_uptime
          text: !lambda |-
            const char* uptime = id(up_sens_text).state.c_str();
            return uptime;

### SCREENSAVER FORECAST CONDITION ###
  - platform: homeassistant
    id: external_temp_condition
    entity_id: ${screensaver_weather_entity}
    internal: true
    on_value:
      then:
        - lvgl.widget.show: temp_condition_label
        - lvgl.label.update:
            id: temp_condition_label  
            text: !lambda |-
              static char buf[20];
              std::string icon;
              if (id(external_temp_condition).state == "clear-night") {
                  icon = "\U000F0594";
              } else if (id(external_temp_condition).state == "cloudy") {
                  icon = "\U000F0590";
              } else if (id(external_temp_condition).state == "exceptional") {
                  icon = "\U000F0F2F";
              } else if (id(external_temp_condition).state == "fog") {
                  icon = "\U000F0591";
              } else if (id(external_temp_condition).state == "hail") {
                  icon = "\U000F0592";
              } else if (id(external_temp_condition).state == "lightning") {
                  icon = "\U000F0593";
              } else if (id(external_temp_condition).state == "lightning-rainy") {
                  icon = "\U000F067E";
              } else if (id(external_temp_condition).state == "partlycloudy") {
                  icon = "\U000F0595";
              } else if (id(external_temp_condition).state == "pouring") {
                  icon = "\U000F0596";
              } else if (id(external_temp_condition).state == "rainy") {
                  icon = "\U000F0597";
              } else if (id(external_temp_condition).state == "snowy") {
                  icon = "\U000F0598";
              } else if (id(external_temp_condition).state == "snowy-rainy") {
                  icon = "\U000F067F";
              } else if (id(external_temp_condition).state == "sunny") {
                  icon = "\U000F0599";
              } else if (id(external_temp_condition).state == "windy") {
                  icon = "\U000F059D";
              } else if (id(external_temp_condition).state == "windy-variant") {
                  icon = "\U000F059E";
              } else if (id(external_temp_condition).state == "sunny-off") {
                  icon = "\U000F14E4"; 
              } else {
                  icon = "\U000F14E4";
              }
              snprintf(buf, sizeof(buf), "%s", icon.c_str());
              return buf;

