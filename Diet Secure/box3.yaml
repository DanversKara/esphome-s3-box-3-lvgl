speaker:
  - id: i2s_audio_speaker
    platform: i2s_audio
    i2s_audio_id: audio_bus
    i2s_dout_pin: ${speaker_i2s_dout_pin}
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono
    audio_dac: es8311_dac
    buffer_duration: 100ms

  - id: mixing_speaker
    platform: mixer
    output_speaker: i2s_audio_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

media_player:
  - platform: speaker
    name: Media Player
    id: speaker_media_player
    task_stack_in_psram: true
    volume_increment: 0.05
    volume_min: 0.5
    volume_max: 0.8
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 2
      sample_rate: 48000
    on_state:
      then:
        - lambda: ESP_LOGD("media_player", "on_state");
        - if:
            condition:
              not:
                media_player.is_announcing:
            then:
              - mixer_speaker.apply_ducking:
                  id: media_mixing_input
                  decibel_reduction: 0
                  duration: 1.0s
    on_announcement:
      - lambda: ESP_LOGD("media_player", "on_announcement");
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_pause:
      - media_player.stop
    on_volume:
      - lambda: |-
          ESP_LOGD("volume", "Volume: %f", x);
      - lambda: id(speaker_volume) = int(x * 10) ;

script:
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - script.execute: saver_enabled
            - if:
                condition:
                  and:
                    - or:
                        - lambda: return id(ethernet_connection);
                        - lambda: return id(wifi_connection);
                    - lambda: return id(api_connection);
                then:
                  - lvgl.widget.hide: lbl_no_ha_connection
                else:
                  - lvgl.widget.show: lbl_no_ha_connection

  - id: saver_enabled
    then:
      - if:
          condition:
            and:
              - switch.is_on: s_saver
              - not:
                  lvgl.page.is_showing: saver_page
          then:
            - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
            - delay: !lambda return id(s_saver_delay).state * 1000;
            - lambda: id(led).turn_on().set_brightness(id(s_saver_brightness).state /100).perform();
            - lvgl.page.show: saver_page
      - if:
          condition:
            and:
              - switch.is_on: s_saver_mode
              - lvgl.page.is_showing: saver_page
          then:
            - delay: !lambda return id(s_saver_blank_delay).state * 1000;
            - light.turn_off: led
    mode: restart

  - id: saver_enabled_manual
    then:
      - if:
          condition:
            - switch.is_on: s_saver
          then:
            - lambda: id(led).turn_on().set_brightness(id(s_saver_brightness).state /100).perform();
            - lvgl.page.show: saver_page

      - if:
          condition:
            - switch.is_on: s_saver_mode
          then:
            - delay: !lambda return id(s_saver_blank_delay).state * 1000;
            - light.turn_off: led
    mode: restart

  - id: time_update
    then:
      - lvgl.label.update:
          id: daydate_label
          text: !lambda |-
            static const char* days[] {"${sun}","${mon}","${tue}","${wed}","${thur}","${fri}","${sat}"};
            static const char* months[] {"${january}","${february}","${march}","${april}","${may}","${june}","${july}","${august}","${september}","${october}","${november}","${december}"};
            auto t = id(ha_time).now();
            char buffer[50];
            sprintf(buffer, "%s %s %d",days[t.day_of_week - 1],months[t.month - 1],t.day_of_month);
            return std::string(buffer);
      - lvgl.label.update:
          id: home_date_label
          text: !lambda |-
            static const char* days[] {"${sun}","${mon}","${tue}","${wed}","${thur}","${fri}","${sat}"};
            static const char* months[] {"${january}","${february}","${march}","${april}","${may}","${june}","${july}","${august}","${september}","${october}","${november}","${december}"};
            auto t = id(ha_time).now();
            char buffer[50];
            sprintf(buffer, "%s %s %d",days[t.day_of_week - 1],months[t.month - 1],t.day_of_month);
            return std::string(buffer);
      - if:
          condition:
            - lambda: 'return { id(time_format).current_option() == "24 Hr" };'
          then:
            - lvgl.label.update:
                id: digitaltime
                text: 
                  time_format: "%H:%M"
                  time: !lambda return id(ha_time).now();
            - lvgl.label.update:
                id: home_clock_label
                text: 
                  time_format: "%H:%M"
                  time: !lambda return id(ha_time).now();
          else:
            - lvgl.label.update:
                id: digitaltime
                text: 
                  time_format: "%l:%M %p"
                  time: !lambda return id(ha_time).now();
            - lvgl.label.update:
                id: home_clock_label
                text: 
                  time_format: "%l:%M %p"
                  time: !lambda return id(ha_time).now();
      - if:
          condition:
            and:
              - switch.is_on: reboot_schedule
              - lambda: 'return { (id(ha_time).now().hour == id(reboot_time).hour) };'
              - lambda: 'return { (id(ha_time).now().minute == id(reboot_time).minute) };'
              - lambda: 'return { (id(ha_time).now().second <= 15) };'
          then:
            - delay: 10s
            - button.press: reboot
    mode: single
    
    
  - id: set_uimode
    then:
      - if:
          condition: 
            - lambda: return (id(uimode).current_option() != id(current_uimode));
          then:
            - if:
                condition: 
                  lambda: return (id(uimode).current_option() == "Home");
                then:
                  - lvgl.style.update:
                      id: header_footer
                      bg_color: 0x595959
                      bg_grad_color: 0x404040
                  - lvgl.style.update:
                      id: button_style
                      bg_color: 0x000000
                      bg_grad_color: 0x404040
                  - lvgl.style.update:
                      id: button_standard_style
                      bg_color: 0x216dab
                      bg_grad_color: 0x404040
                  - lvgl.style.update:
                      id: button_pressed_style
                      bg_color: 0x666666
                      bg_grad_color: 0x00334d
                  - lvgl.style.update:
                      id: button_checked_style
                      bg_color: 0x000000
                      bg_grad_color: 0x002233
            - lambda: strncpy(id(current_uimode), id(uimode).current_option().c_str(), 50);
            - lvgl.widget.redraw:

switch:
  - platform: gpio
    name: Speaker Enable
    id: speaker_enable
    pin:
      number: ${speaker_enable_pin}
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    disabled_by_default: true

  - platform: template
    name: Require PIN to unlock front door
    id: front_door_require_pin
    icon: 'mdi:lock-question'
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    turn_on_action:
      - lvgl.checkbox.update:
          id: chk_front_door_pin
          state:
            checked: true
    turn_off_action:
      - lvgl.checkbox.update:
          id: chk_front_door_pin
          state:
            checked: false

  - platform: template
    name: "Reboot Schedule"
    id: reboot_schedule
    icon: 'mdi:restart'
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: s_saver
    name: ScrSave enable
    icon: mdi:sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lvgl.checkbox.update:
          id: chk_screensaver
          state:
            checked: true
    turn_off_action:
      - lvgl.checkbox.update:
          id: chk_screensaver
          state:
            checked: false

  - platform: template
    id: s_saver_mode
    name: ScrOff enable
    icon: 'mdi:monitor-off'
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lvgl.checkbox.update:
          id: chk_timeout_blank
          state:
            checked: true
    turn_off_action:
      - lvgl.checkbox.update:
          id: chk_timeout_blank
          state:
            checked: false

  - platform: template
    id: s_saver_presc
    name: Screen wake on motion
    icon: 'mdi:motion-sensor'
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lvgl.checkbox.update:
          id: chk_wake_presence
          state:
            checked: true
    turn_off_action:
      - lvgl.checkbox.update:
          id: chk_wake_presence
          state:
            checked: false

  - platform: at581x
    at581x_id: "Radar"
    id: radar_enable
    name: "Radar Enable"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - lambda: id(radar_state) = false;

select:
  - platform: lvgl
    id: time_format
    entity_category: config
    restore_value: true
    name: Time Format
    widget: dropdown_timeformat

  - platform: lvgl
    id: ss_clockstyle
    entity_category: config
    restore_value: true
    name: Screensaver Clock
    widget: dropdown_ssclock
    
  - platform: lvgl
    id: uimode
    entity_category: config
    restore_value: true
    name: UI Mode
    widget: dropdown_uimode

  - platform: template
    id: temp_unit
    name: "Temperature Unit"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - Celsius
      - Fahrenheit
    initial_option: Celsius
    on_value:
      - if:
          condition:
            lambda: return id(temp_unit).current_option() == "Celsius";
          then:
            - lvgl.dropdown.update:
                id: dropdown_tempunit
                selected_index: 0
          else:
            - lvgl.dropdown.update:
                id: dropdown_tempunit
                selected_index: 1

datetime:
  - id: reboot_time
    platform: template
    type: time
    optimistic: true
    restore_value: true
    initial_value:
      hour: 02
      minute: 00
      second: 00
    name: "Reboot Time"
    icon: 'mdi:restart-alert'
    entity_category: config

number:
  - id: s_saver_delay
    platform: template
    name: "ScrSave delay"
    icon: 'mdi:sleep'
    entity_category: config
    unit_of_measurement: 'secs'
    optimistic: true
    restore_value: true
    initial_value: 120
    step: 5
    min_value: 10
    max_value: 999999
    on_value:
      - component.update: s_saver_delay
      - script.execute: saver_enabled
      - lvgl.spinbox.update:
          id: spinbox_delay
          value: !lambda return x;

  - id: s_saver_blank_delay
    platform: template
    name: "ScrOff delay"
    icon: 'mdi:monitor-off'
    entity_category: config
    unit_of_measurement: 'secs'
    optimistic: true
    restore_value: true
    initial_value: 1800
    step: 5
    min_value: 10
    max_value: 999999
    on_value:
      - component.update: s_saver_blank_delay
      - script.execute: saver_enabled
      - lvgl.spinbox.update:
          id: spinbox_scr_delay
          value: !lambda return x;

  - id: s_saver_brightness
    platform: template
    name: "ScrSave Brightness"
    icon: 'mdi:sleep'
    entity_category: config
    unit_of_measurement: '%'
    optimistic: true
    restore_value: true
    initial_value: 40
    step: 5
    min_value: 20
    max_value: 100
    on_value:
      - component.update: s_saver_brightness
      - script.execute: saver_enabled
      - lvgl.slider.update:
          id: slider_dimbrightness
          value: !lambda return x;

  - id: s_default_brightness
    platform: template
    name: "Default Brightness"
    icon: 'mdi:monitor'
    entity_category: config
    unit_of_measurement: '%'
    optimistic: true
    restore_value: true
    initial_value: 100
    step: 5
    min_value: 20
    max_value: 100
    on_value:
      - component.update: s_default_brightness
      - script.execute: saver_enabled
      - lvgl.slider.update:
          id: slider_brightness
