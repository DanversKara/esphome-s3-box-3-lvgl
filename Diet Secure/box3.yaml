text_sensor:
### LIGHT WIDGET STATE SENSOR ###
  - platform: homeassistant
    id: light_widget_state
    entity_id: ${light_widget_entity}
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: return (x == "on");
            then:
              - lvgl.widget.update:
                  id: btn_light_widget_toggle
                  state:
                    checked: true
              - lvgl.label.update:
                  id: ico_light_widget
                  text: "\U000F06E8"
                  text_color: yellow
            else:
              - lvgl.widget.update:
                  id: btn_light_widget_toggle
                  state:
                    checked: false
              - lvgl.label.update:
                  id: ico_light_widget
                  text: "\U000F0335"
                  text_color: 0x888888
### FRONT DOOR LOCK SCREEN SENSOR ###
  - platform: homeassistant
    id: front_door_item
    entity_id: ${front_door_entity}
    internal: true
    on_value:
      then:
        - if:
            # HA can briefly report "unavailable"/"unknown" for this
            # entity right as the ESP (re)connects to the API, or while
            # HA itself is restarting. That used to get read as "not
            # locked" and flash the lock screen/homepage icon red (and
            # fool the Welcome Home popup check) even though the door
            # was never actually unlocked. Only trust — and remember —
            # an actual state report; ignore anything else and leave the
            # display showing whatever was last confirmed.
            condition:
              lambda: |-
                std::string s = id(front_door_item).state;
                return s == "locked" || s == "unlocked" || s == "open"
                    || s == "locking" || s == "unlocking" || s == "jammed";
            then:
              - lambda: id(front_door_known_state) = id(front_door_item).state;
              - if:
                  condition:
                    lambda: return id(front_door_known_state) == "locked";
                  then:
                    - lvgl.label.update:
                        id: ico_front_door_lock
                        text_color: lime
                        text: "\U000F033E"
                    - lvgl.label.update:
                        id: lbl_front_door_status
                        text_color: lime
                        text: "LOCKED"
                    - lvgl.label.update:
                        id: lbl_front_door_action
                        text: "Tap to Unlock"
                    - lvgl.widget.update:
                        id: but_front_door_lock
                        bg_color: 0x001a00
                        bg_grad_color: 0x003300
                    - lvgl.label.update:
                        id: ico_home_door_status
                        text_color: lime
                        text: "\U000F033E"
                  else:
                    - lvgl.label.update:
                        id: ico_front_door_lock
                        text_color: red
                        text: "\U000F033F"
                    - lvgl.label.update:
                        id: lbl_front_door_status
                        text_color: red
                        text: "UNLOCKED"
                    - lvgl.label.update:
                        id: lbl_front_door_action
                        text: "Tap to Lock"
                    - lvgl.widget.update:
                        id: but_front_door_lock
                        bg_color: 0x330000
                        bg_grad_color: 0x1a0000
                    - lvgl.label.update:
                        id: ico_home_door_status
                        text_color: red
                        text: "\U000F033F"

### HOME SCREEN WEATHER CONDITION SENSOR ###
  - platform: homeassistant
    id: weather_condition_item
    entity_id: ${weather_entity}
    internal: true
    on_value:
      then:
        - if:
            # Same defensive pattern as the front door sensor above:
            # ignore "unavailable"/"unknown"/empty blips from HA and
            # just keep showing the last confirmed condition, rather
            # than blanking the weather background/icon every time HA
            # restarts or briefly drops the connection.
            condition:
              lambda: |-
                std::string s = id(weather_condition_item).state;
                return !s.empty() && s != "unavailable" && s != "unknown";
            then:
              - lambda: id(weather_known_condition) = id(weather_condition_item).state;
              - lvgl.label.update:
                  id: ico_home_weather
                  text: !lambda |-
                    std::string c = id(weather_known_condition);
                    if (c == "sunny") return "\U000F0599";
                    if (c == "clear-night") return "\U000F0594";
                    if (c == "cloudy") return "\U000F0590";
                    if (c == "partlycloudy") return "\U000F0595";
                    if (c == "rainy") return "\U000F0597";
                    if (c == "pouring") return "\U000F0596";
                    if (c == "lightning") return "\U000F0593";
                    if (c == "lightning-rainy") return "\U000F067E";
                    if (c == "snowy") return "\U000F0598";
                    if (c == "snowy-rainy") return "\U000F067F";
                    if (c == "fog") return "\U000F0591";
                    if (c == "hail") return "\U000F0592";
                    if (c == "windy" || c == "windy-variant") return "\U000F059D";
                    if (c == "exceptional") return "\U000F0F2F";
                    return "";
              - lvgl.widget.show: ico_home_weather
              - lvgl.widget.update:
                  id: weather_bg
                  bg_color: !lambda |-
                    std::string c = id(weather_known_condition);
                    if (c == "sunny") return lv_color_hex(0x0d3b66);
                    if (c == "clear-night") return lv_color_hex(0x05051a);
                    if (c == "cloudy") return lv_color_hex(0x2b2b30);
                    if (c == "partlycloudy") return lv_color_hex(0x0f2942);
                    if (c == "rainy") return lv_color_hex(0x0d1f33);
                    if (c == "pouring") return lv_color_hex(0x081420);
                    if (c == "lightning" || c == "lightning-rainy") return lv_color_hex(0x14101f);
                    if (c == "snowy" || c == "snowy-rainy") return lv_color_hex(0x1a2733);
                    if (c == "fog" || c == "hail") return lv_color_hex(0x333333);
                    if (c == "windy" || c == "windy-variant") return lv_color_hex(0x1f2e26);
                    return lv_color_hex(0x000000);
                  bg_grad_color: !lambda |-
                    std::string c = id(weather_known_condition);
                    if (c == "sunny") return lv_color_hex(0xd98e04);
                    if (c == "clear-night") return lv_color_hex(0x1a1a4d);
                    if (c == "cloudy") return lv_color_hex(0x4d4d55);
                    if (c == "partlycloudy") return lv_color_hex(0x36536b);
                    if (c == "rainy") return lv_color_hex(0x1a3a5c);
                    if (c == "pouring") return lv_color_hex(0x11283d);
                    if (c == "lightning" || c == "lightning-rainy") return lv_color_hex(0x2b2140);
                    if (c == "snowy" || c == "snowy-rainy") return lv_color_hex(0x3d5266);
                    if (c == "fog" || c == "hail") return lv_color_hex(0x555555);
                    if (c == "windy" || c == "windy-variant") return lv_color_hex(0x37503f);
                    return lv_color_hex(0x000000);

