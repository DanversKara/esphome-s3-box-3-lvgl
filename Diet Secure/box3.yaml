                              text: " "
                          - label:
                              id: ico_home_battery
                              hidden: true
                              text_font: iconfont_small
                              text_color: 0xFFFFFF
                              text: "\U000F008E"
                          - label:
                              id: lbl_home_battery
                              hidden: true
