binary_sensor:
  # ── Front Door Lock Screen — door status sensors ──────────────────────────
  - platform: homeassistant
    id: door_alarm_door_item
    entity_id: ${door_alarm_door_entity}
    internal: true
    trigger_on_initial_state: true
    on_state:
      then:
        - if:
            condition:
              lambda: return x;
            then:
              - lvgl.label.update:
                  id: lbl_door_alarm_status
                  text_color: amber
                  text: '${door_alarm_door_name}: Open'
              - lvgl.label.update:
                  id: ico_home_door_alarm
                  text_color: red
                  text: "\U000F081C"
            else:
              - lvgl.label.update:
                  id: lbl_door_alarm_status
                  text_color: 0xCCCCCC
                  text: '${door_alarm_door_name}: Closed'
              - lvgl.label.update:
                  id: ico_home_door_alarm
                  text_color: green
                  text: "\U000F081B"

  # side physical button
  - platform: gpio
    pin:
      number: ${side_button_pin}
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    id: side_top_button
    internal: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - script.execute: draw_display
          - if:
              condition:
                - media_player.is_playing:
              then:
                - media_player.stop:
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_btn

  # red circle home button
  - platform: gt911
    id: home_button
    index: 0
    on_press:
      - if:
          condition:
            - media_player.is_playing:
          then:
            - media_player.stop:
      - if:
          condition:
            - lvgl.page.is_showing: ${default_page}
          then:
            # Home screen: red circle opens the front door lock/unlock control.
            # PIN is asked first only if "Require PIN to unlock" is on.
            - if:
                condition:
                  switch.is_on: front_door_require_pin
                then:
                  - lvgl.widget.hide: lbl_keypad_error
                  - lambda: id(alarm_action) = "view_lock_page";
                  - lvgl.page.show: alarm_keypad_page
                else:
                  - lvgl.page.show: main_lock_page
          else:
            - if:
                # Front door lock screen, its keypad, or the light widget —
                # all reached directly from home — cancel back to home.
                condition:
                  or:
                    - lvgl.page.is_showing: main_lock_page
                    - lvgl.page.is_showing: alarm_keypad_page
                    - lvgl.page.is_showing: liv_lite_page
                    - lvgl.page.is_showing: menu_pages_page
                then:
                  - lambda: id(alarm_action) = "";
                  - lvgl.page.show: idle_page
                else:
                  - if:
                      # Leaf pages under the Settings hub — back to the hub.
                      condition:
                        or:
                          - lvgl.page.is_showing: lock_set_page
                          - lvgl.page.is_showing: info_page
                          - lvgl.page.is_showing: device_set_page
                          - lvgl.page.is_showing: ui_set_page
                          - lvgl.page.is_showing: wifi_page
                          - lvgl.page.is_showing: bluetooth_page
                      then:
                        - lvgl.page.show: settings_hub_page
                      else:
                        # Settings hub itself, or anywhere unexpected — back to home.
                        - lvgl.page.show: idle_page
            - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
            - script.execute: draw_display

################## config end ############################
