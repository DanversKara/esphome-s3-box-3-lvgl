###### Hardware Specific Configuration ######

  font_bpp: 1 #1,2,4,8 - Higher bit depth increases flash usage
  font_icon_bpp: 4 #1,2,4,8 - Higher bit depth increases flash usage
  image_byte_order: little_endian
  lvgl_byte_order: big_endian
  image_resize: 318x238 # 2px below width by height of screen

  wifi_fast_connect: false
  wifi_power_save_mode: LIGHT #NONE, LIGHT(default for esp32), HIGH
  wifi_use_native_roaming: true #if false uses ESPHome post connect roaming

  screen_max_brightness: 1.0

  speaker_i2s_dout_pin: GPIO15
  speaker_enable_pin: GPIO46

  side_button_pin: GPIO0
  
  page_content_height: 210
  taskbar_height: 30
  button_radius: 15

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz #160MHz to improve battery life, 240MHz otherwise.
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y" 
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y" 
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

# ── Bluetooth ──────────────────────────────────────────────────────────────
# Makes the Box3 visible to Home Assistant's Bluetooth integration as a
# scanner/proxy (shows up under Settings > Devices & Services > Bluetooth,
# same as any other discovered adapter). Light scan duty-cycle so it doesn't
# compete with WiFi/audio.
esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 30ms

bluetooth_proxy:
  active: true

logger:
  hardware_uart: USB_SERIAL_JTAG
  logs:
    lvgl: info
    text_sensor: ERROR
    component: ERROR

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

i2c:
  - id: bus_a
    sda: GPIO08
    scl: GPIO18
    scan: true
    sda_pullup_enabled: true
    scl_pullup_enabled: true
    frequency: 100kHz

  - id: bus_b
    sda: GPIO41
    scl: GPIO40
    scan: true
    sda_pullup_enabled: true
    scl_pullup_enabled: true
    frequency: 100kHz

at581x:
  id: "Radar"
  i2c_id: bus_b

touchscreen:
  - platform: gt911
    i2c_id: bus_a
    address: 0x5D
    id: gt911_touchscreen
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true
    on_touch:
      - lambda: ESP_LOGD("touchscreen", "on_touch");
      - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
    on_release:
      then:
        - if:
            condition: lvgl.is_paused
            then:
              - light.turn_on: led
              - lvgl.resume:
              - lvgl.widget.redraw:
        - if:
            condition:
              - lvgl.page.is_showing: saver_page
            then:
              - lvgl.page.show: ${default_page}
              - script.execute: draw_display

i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO2

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    id: box_mic
    sample_rate: 16000
    i2s_din_pin: GPIO16
    bits_per_sample: 16bit
    adc_type: external

spi:
  - id: spi_bus
    clk_pin: 7
    mosi_pin: 6

display:
  - platform: mipi_spi
    id: s3_box_lcd
    model: S3BOX
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 4
    reset_pin:
      number: 48
      inverted: true
    update_interval: never
    auto_clear_enabled: false
    color_order: bgr
    invert_colors: false

#### WIFI
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: ${wifi_fast_connect}
  power_save_mode: ${wifi_power_save_mode}
  enable_btm: ${wifi_use_native_roaming}  # 802.11v BSS Transition Management
  enable_rrm: ${wifi_use_native_roaming}  # 802.11k Radio Resource Management
  ap:
    ssid: ${name}
    password: ${wifi_fallback_pwd}   
  on_connect:
    - lambda: id(wifi_connection) = true;
    - script.execute: draw_display
    - switch.turn_on: speaker_enable
  on_disconnect:
    - lambda: id(wifi_connection) = false;
    - script.execute: draw_display

captive_portal:

###### Standard Configuration ######
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - delay: 15s
      - at581x.settings:
          id: "Radar"
          sensing_distance: 1000
          stage_gain: 4
      - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
      - script.execute: draw_display
      - if:
          condition:
            - lambda: return !id(radar_state);
          then:
            - switch.turn_off: radar_enable
      - delay: 30s
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - lambda: id(init_in_progress) = false;
            - script.execute: draw_display
  on_shutdown:
    then:
      - if:
          condition:
            switch.is_off: radar_enable
          then:
            - lambda: id(radar_state) = false;
          else:
            - lambda: id(radar_state) = true;

  project:
    name: "Christian.s3box3"
    version: "2026.04.16"

api:
  encryption:
    key: ${api_key}
  on_client_connected:
    - lambda: |-
        id(api_fail_count) = 0;
        id(api_connection) = true;
    - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
    - script.execute: draw_display
  on_client_disconnected:
    - lambda: |-
        id(api_fail_count) = 0;
        id(api_connection) = false;
    - script.execute: draw_display

ota:
  - platform: esphome
    id: ota_esphome
    on_begin:
      - lambda: id(led).turn_on().set_brightness(${screen_max_brightness}).set_transition_length(0).perform();
                id(led).loop();
      - lambda: "id(lvgl_display).loop();"
    on_progress:
      then:
        - lambda: "id(lvgl_display).loop();"

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update

interval:
  - interval: 2s #requires WIFI - fast disconnect detection only
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: |-
                id(api_fail_count) = 0;
                id(api_connection) = true;
          else:
            - lambda: id(api_fail_count) += 1;
            - if:
                # Require a few consecutive failed checks before acting, so a
                # single momentary blip doesn't flash "No HA Connection". This is
                # a local state check (api.connected), not a network ping, so it
                # doesn't add any extra traffic on its own — but a genuinely
                # flaky WiFi/AP will still legitimately reconnect a lot, which
                # is worth investigating separately if this keeps firing.
                condition:
                  and:
                    - lambda: return id(api_fail_count) >= 3;
                    - lambda: return !id(init_in_progress);
                then:
                  - lambda: id(api_connection) = false;
                  - script.execute: draw_display
      - if:
          condition:
            and:
              - lambda: return !(id(ethernet_connection) || id(wifi_connection));
              - lambda: return !id(init_in_progress);
          then:
            - script.execute: draw_display

  - interval: 15s #requires WIFI - periodic display refresh
    then:
      - script.execute: draw_display
      - if: #requires WIFI
          condition:
            - lambda: return id(wifi_connection);
          then:
            - lvgl.label.update:
                id: lbl_ip
                text: !lambda |-
                  const char* ip = id(ip_addr).state.c_str();
                  return ip;
            - lvgl.label.update:
                id: lbl_ssid
                text: !lambda |-
                  const char* ssid = id(connected_ssid).state.c_str();
                  return ssid;
            - lvgl.label.update:
                id: lbl_mac
                text: !lambda |-
                  const char* mac = id(device_mac).state.c_str();
                  return mac;

  - interval: 10s
    then:
      - if:
          condition:
            lambda: return !id(use_room_temp);
          then:
            - lambda: |-
                float celsius = id(s3temp).state;
                if (id(temp_unit).current_option() == "Fahrenheit") {
                  id(display_temp) = celsius * 9.0 / 5.0 + 32.0;
                } else {
                  id(display_temp) = celsius;
                }
            - lvgl.label.update:
                id: temp_label
                text: !lambda |-
                  char buf[10];
                  sprintf(buf, "%.${screensaver_temperature_dp}f%s", id(display_temp), id(temp_unit).current_option() == "Fahrenheit" ? "°F" : "°C");
                  return buf;
            - lvgl.label.update:
                id: humidity_label
                text: !lambda |-
                  char buf[10];
                  sprintf(buf, "%.${screensaver_humidity_dp}f%s", id(s3humidity).state, "%");
                  return buf;

button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true

  - platform: restart
    id: reboot
    name: "Reboot"
    entity_category: diagnostic

  - platform: template
    id: restart_radar
    name: "Radar Reset"
    entity_category: diagnostic
    on_press:
      at581x.reset:
        id: "Radar"

light:
  - platform: monochromatic
    id: led
    name: LCD Backlight
    entity_category: config
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 50ms
    on_turn_on:
      - lvgl.resume:
      - lvgl.widget.redraw:
    on_turn_off:
      - lvgl.pause:
          show_snow: true
      - delay: 60s
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.pause:
                show_snow: false

sensor:
  - platform: aht10
    i2c_id: bus_b
    variant: AHT20
    temperature:
      name: "S3 Temperature"
      filters:
        - lambda: |-
            return x + id(temp_offset_number).state;
      id: s3temp
      on_value:
        - delay: 15s
        - if:
            condition: 
              lambda: return !id(use_room_temp);
            then:
              - lvgl.widget.show: temp_label
    humidity:
      name: "S3 Humidity"
      id: s3humidity
      on_value:
        - delay: 15s
        - if:
            condition: 
              lambda: return !id(use_room_temp);
            then:
              - lvgl.widget.show: humidity_label
    update_interval: 30s

  - platform: adc
    pin: GPIO10
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: "voltage"
    entity_category: "diagnostic"
    disabled_by_default: true
    update_interval: 30s
    attenuation: auto
    filters:
      - multiply: 4.11

  - platform: copy
    id: battery_percent
    source_id: battery_voltage
    name: "Battery level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: "battery"
    entity_category: "diagnostic"
    filters:
      - lambda: return (x - 2.7) / (4.2 - 2.7) * 100;
      - clamp:
          min_value: 0
          max_value: 100
    on_value:
      - lvgl.label.update:
          id: lbl_battery
          text: !lambda |-
            char buf[10];
            sprintf(buf, "%.f%%", id(battery_percent).state);
            return buf;
      - if:
          condition:
              lambda: return (x > 0);
          then:
            - lvgl.widget.show: lbl_battery_title
            - lvgl.widget.show: lbl_battery
          else:
            - lvgl.widget.hide: lbl_battery_title
            - lvgl.widget.hide: lbl_battery
    
  - platform: uptime
    id: up_sens
    on_value:
      - lambda: |-
          int seconds = id(up_sens).state;
          int days = seconds / 86400;
          int hours = seconds / 3600;
          int minutes = (seconds % 3600) / 60;
          seconds %= 60;
          id(up_sens_text).publish_state(str_sprintf("%03d:%02d:%02d:%02d", days, hours, minutes, seconds));
    update_interval: 300s

  - platform: wifi_signal #requires WIFI
    name: "WiFi db"
    id: wifi_signal_db
    update_interval: 30s

  - platform: copy #requires WIFI
    source_id: wifi_signal_db
    name: "WiFi Signal"
    id: wifi_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    on_value:
      - lvgl.label.update:
          id: lbl_ss
          text: !lambda |-
            char buf[10];
            sprintf(buf, "%.f%%", id(wifi_percent).state);
            return buf;

