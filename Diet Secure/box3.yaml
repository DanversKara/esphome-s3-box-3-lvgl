###### Standard Configuration ######
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  name_add_mac_suffix: false
  # esp_wifi_scan.h wraps the ESP-IDF wifi scan API (esp_wifi_scan_start /
  # esp_wifi_scan_get_ap_records) so the lambda in wifi_do_scan can call it
  # directly — ESPHome's wifi: component has no built-in "scan" action.
  # Must sit next to this YAML file.
  includes:
    - esp_wifi_scan.h
  on_boot:
    priority: 600
    then:
      - delay: 15s
      - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
      - script.execute: draw_display
      - delay: 30s
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - lambda: id(init_in_progress) = false;
            - script.execute: draw_display

  project:
    name: "Christian.s3box3"
    version: "2026.04.16"

api:
  encryption:
    key: ${api_key}
  reboot_timeout: 0s # same reasoning as wifi.reboot_timeout above — don't
                      # auto-reboot just because no HA client is connected
                      # for >15min while this device is out with you.
  on_client_connected:
    - lambda: |-
        id(api_fail_count) = 0;
        id(api_connection) = true;
    - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
    - script.execute: draw_display
    - if:
        condition:
          lambda: |-
            return id(had_api_connection);
        then:
          # Popup now lives in lvgl: top_layer, so it overlays whatever
          # screen is currently showing — no page switch needed. Only
          # exception: don't interrupt someone who's mid-entry on the
          # settings PIN keypad (alarm_keypad_page with alarm_action ==
          # "settings_unlock"). The front-door-unlock keypad isn't
          # excluded — the popup can show over that one.
          #
          # Triggered off had_api_connection (has the API connected at
          # least once since the ESP booted) rather than disconnect_since_ms
          # (a timestamp set only if on_client_disconnected or the 2s poll
          # actually caught the outage). That detection can miss fast/soft
          # drops — a graceful HA restart or a brief WiFi roam — so the
          # popup silently failed to appear even though this was a real
          # reconnect. had_api_connection only needs "was there ever a
          # prior connection", which on_client_connected firing again
          # already guarantees.
          - if:
              condition:
                not:
                  and:
                    - lvgl.page.is_showing: alarm_keypad_page
                    - lambda: 'return id(alarm_action) == "settings_unlock";'
              then:
                - lvgl.widget.show: reconnect_unlock_popup
    - lambda: |-
        id(had_api_connection) = true;
        id(disconnect_since_ms) = 0;
  on_client_disconnected:
    - lambda: |-
        id(api_fail_count) = 0;
        id(api_connection) = false;
        id(disconnect_since_ms) = millis();
    - script.execute: draw_display

ota:
  - platform: esphome
    id: ota_esphome
    on_begin:
      - lambda: id(led).turn_on().set_brightness(${screen_max_brightness}).set_transition_length(0).perform();
                id(led).loop();
      - lambda: "id(lvgl_display).loop();"
    on_progress:
      then:
        - lambda: "id(lvgl_display).loop();"

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update
  # Fallback clock source: syncs over plain WiFi/internet (NTP) so the
  # clock still comes up if HA is unreachable/rebooting when the ESP
  # boots. ha_time (above) is still preferred whenever it's synced,
  # since it also carries HA's configured timezone. time_update below
  # falls back to this only when ha_time hasn't synced yet.
  # Note: this can't help on a true cold boot with zero network at all —
  # the S3 Box 3 has no battery-backed RTC, so with neither HA, WiFi, nor
  # internet ever reached since power-on there is genuinely no way for
  # the device to know the real time.
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    on_time_sync:
      - script.execute: time_update

interval:
  - interval: 2s #requires WIFI - fast disconnect detection only
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: |-
                id(api_fail_count) = 0;
                id(api_connection) = true;
          else:
            - lambda: id(api_fail_count) += 1;
            - if:
                # Require a few consecutive failed checks before acting, so a
                # single momentary blip doesn't flash "No HA Connection". This is
                # a local state check (api.connected), not a network ping, so it
                # doesn't add any extra traffic on its own — but a genuinely
                # flaky WiFi/AP will still legitimately reconnect a lot, which
                # is worth investigating separately if this keeps firing.
                condition:
                  and:
                    - lambda: return id(api_fail_count) >= 3;
                    - lambda: return !id(init_in_progress);
                then:
                  - lambda: |-
                      if (id(api_connection)) {
                        // Transitioning connected -> disconnected right now.
                        // on_client_disconnected doesn't always fire promptly
                        // (that's the whole reason this poll exists), so this
                        // is the reliable place to timestamp the outage.
                        id(disconnect_since_ms) = millis();
                      }
                      id(api_connection) = false;
                  - script.execute: draw_display
      - if:
          condition:
            and:
              - lambda: return !(id(ethernet_connection) || id(wifi_connection));
              - lambda: return !id(init_in_progress);
          then:
            - script.execute: draw_display

  - interval: 15s #requires WIFI - periodic display refresh
    then:
      - script.execute: draw_display

